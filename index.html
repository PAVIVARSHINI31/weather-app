<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>

  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #222;
      font-family: Arial;
      margin: 0;
    }

    .card {
      width: 90%;
      max-width: 350px;
      margin: 80px auto;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(135deg, #00feba, #5b548a);
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .search {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search input {
      padding: 10px;
      border-radius: 20px;
      border: none;
      width: 70%;
      font-size: 16px;
    }

    .search button {
      padding: 10px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .search button:hover {
      background: #ddd;
    }

    .icon {
      width: 80px;
    }

    .temp {
      font-size: 40px;
      margin: 10px 0;
    }

    .city {
      font-size: 22px;
    }

    .details {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }

    .col {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }

    .col img {
      width: 30px;
    }

    /* 📱 Mobile */
    @media (max-width: 480px) {
      .temp {
        font-size: 30px;
      }

      .city {
        font-size: 18px;
      }

      .details {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <div class="search">
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">🔍</button>
  </div>

  <div class="weather">
    <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" class="icon">
    
    <h1 class="temp">--°C</h1>
    <h2 class="city">City</h2>

    <div class="details">

      <div class="col">
        <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png">
        <div>
          <p class="humidity">--%</p>
          <span>Humidity</span>
        </div>
      </div>

  
      <div class="col">
        <img src="https://cdn-icons-png.flaticon.com/512/553/553416.png">
        <div>
          <p class="wind">-- km/h</p>
          <span>Wind Speed</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
const apiKey = "YOUR_API_KEY_HERE"; // 🔑 put your key

async function getWeather() {
  const city = document.getElementById("city").value;

  if (city === "") {
    alert("Enter city name");
    return;
  }

  document.querySelector(".temp").innerHTML = "Loading...";

  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  const response = await fetch(url);
  const data = await response.json();

  if (data.cod != 200) {
    alert("City not found");
    return;
  }

  document.querySelector(".city").innerHTML = data.name;
  document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
  document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
  document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
}


document.getElementById("city").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    getWeather();
  }
});
</script>

</body>
</html>
