<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body {
  background: #222;
  font-family: Arial;
}

.card {
  width: 350px;
  margin: 100px auto;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  background: linear-gradient(135deg, #00feba, #5b548a);
  color: white;
}

.search {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.search input {
  padding: 10px;
  border-radius: 20px;
  border: none;
  width: 70%;
}

.search button {
  padding: 10px;
  border-radius: 50%;
  border: none;
  margin-left: 10px;
  cursor: pointer;
}

.icon {
  width: 100px;
}

.temp {
  font-size: 50px;
}

.details {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}
  </style>
</head>
<body>

<div class="card">
  <div class="search">
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">🔍</button>
  </div>

  <div class="weather">
    <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" class="icon">
    <h1 class="temp">--°C</h1>
    <h2 class="city">City</h2>

    <div class="details">
      <div>
        
        <p class="humidity">--%</p>
        <span>Humidity</span>
      </div>
      <div>
        <p class="wind">-- km/h</p>
        <span>Wind Speed</span>
      </div>
    </div>
  </div>
</div>

<script >
    const apiKey = "cd8895fc33013954abde163cc1bb2317";

async function getWeather() {
  const city = document.getElementById("city").value;

  if (city === "") {
    alert("Enter city name");
    return;
  }

  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  const response = await fetch(url);
  const data = await response.json();

  console.log(data); // 👈 DEBUG

  if (data.cod !== 200) {
    alert("City not found");
    return;
  }

  document.querySelector(".city").innerHTML = data.name;
  document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
  document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
  document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
}
</script>
</body>
</html>
